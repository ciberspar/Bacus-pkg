# ======================================================
#  BACUSP - Configuración de Puentes y Magia Negra Linux -> Windows
# ======================================================

[BridgeEngine]
modo_compatibilidad = "magia_negra_activa"
aislamiento = "kernel_namespace_bridge"

[RepositoriosComunitarios]
linux_alpine_mirror = "https://dl-cdn.alpinelinux.org/alpine/v3.20/main/"
linux_debian_mirror = "http://deb.debian.org/debian/"
AUR_community_mirror = "https://aur.archlinux.org/"

[TraductorWindows]
backend = "wsl_silent_exec"
mapear_rutas = "true"
inyectar_entorno = "virtual_rootfs"
